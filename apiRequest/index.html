<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Api Request using XMLHttpRequest</h1>
    <script>
        const requestUrl = "https://api.github.com/users"
        const xhr = new XMLHttpRequest()

        xhr.open("GET",requestUrl)//open() only configures the request. It does not send it.
         xhr.onreadystatechange = function(){
            console.log(xhr.readyState);
            if(xhr.readyState === 4){
                const data = JSON.parse(this.responseText);
                console.log(data)
                console.log(data[0])
                console.log(data[0].events_url)
            }
        }
        xhr.send()//sends request to the server
    </script>
</body>
</html>
